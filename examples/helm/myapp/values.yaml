replicaCount: 1

image:
  repository: myapp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  # k3s ships with Traefik; leave className empty to use the default IngressClass
  className: ""
  annotations: {}
  host: myapp.local
  tls:
    enabled: false
    # kubectl create secret tls myapp-tls --cert=... --key=... -n <namespace>
    secretName: myapp-tls

env:
  MESSAGE: "Hello from myapp!"
  APP_VERSION: "1.0.0"

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi
