# Local development via Docker Compose.
# The same app is deployed to k3s via the Helm chart in ../helm/myapp —
# see en/compose-to-helm.md for how the two map onto each other.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MESSAGE: "Hello from Compose!"
      APP_VERSION: "1.0.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
