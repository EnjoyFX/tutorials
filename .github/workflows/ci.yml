name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pymarkdownlnt --config .pymarkdown.json scan .

  links-check:
    name: Links check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --verbose '**/*.md'
          fail: true

  spellcheck:
    name: Spellcheck (EN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run codespell --config .codespellrc en README.md examples

  syntax-check:
    name: Syntax check (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Python — py_compile
        run: uv run python -m py_compile examples/docker/app.py

      - name: Python — pytest
        run: uv run pytest

      - name: Docker — build
        run: docker build -t myapp:ci examples/docker

      - name: Dockerfile — hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: examples/docker/Dockerfile

      - name: Shell — shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: examples/k3s

      - name: Helm — helm lint
        uses: azure/setup-helm@v4
      - run: helm lint examples/helm/myapp
      - run: helm template myapp examples/helm/myapp --namespace demo

      - name: Docker — smoke test
        run: |
          docker run --rm -d --name myapp-ci -p 8080:8080 myapp:ci
          trap 'docker rm -f myapp-ci >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs myapp-ci
          exit 1
